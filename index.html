      "url": "https://ai-act-service-desk.ec.europa.eu/it/ai-act/annex-3"
    },
    {
      "id": "smart",
      "icon": "❔",
      "sector": "Acquisti",
      "title": "La piattaforma «SmartComune»",
      "text": "Un fornitore propone «SmartComune AI», che promette di velocizzare le pratiche dei cittadini. La brochure non spiega se ordina file, assegna priorità o valuta i requisiti per ottenere prestazioni.",
      "answer": "verifica",
      "reasons": [
        "Basta sapere che il programma usa l’IA generativa.",
        "Serve sapere quali funzioni svolge e quali decisioni influenza prima di classificarlo.",
        "Qualsiasi prodotto con nome commerciale che contiene AI è vietato."
      ],
      "right": 1,
      "why": "La descrizione commerciale non basta: un semplice smistamento documentale è molto diverso dalla valutazione dell’accesso a un servizio essenziale.",
      "check": "Richiedere al fornitore documentazione su finalità prevista, funzioni, utenti, output e uso nei procedimenti.",
      "offices": "Acquisti, RTD, responsabile del procedimento, ICT e secondo il caso DPO/legale.",
      "ref": "Art. 6 e Allegato III",
      "url": "https://ai-act-service-desk.ec.europa.eu/it/ai-act/annex-3"
    },
    {
      "id": "telecamere",
      "icon": "📷",
      "sector": "Spazi pubblici",
      "title": "Le telecamere intelligenti",
      "text": "Il Comune valuta una piattaforma per le telecamere del centro storico. Il fornitore scrive solo «riconoscimento intelligente per la sicurezza», senza indicare se rileva flussi, identifica persone o confronta volti con banche dati.",
      "answer": "verifica",
      "reasons": [
        "La finalità, la funzione biometrica e l’eventuale identificazione delle persone sono determinanti per la verifica.",
        "La parola «sicurezza» rende automaticamente qualsiasi uso lecito.",
        "Ogni telecamera stradale è vietata in modo assoluto."
      ],
      "right": 0,
      "why": "La natura della funzione cambia radicalmente la disciplina: rilevare flussi non è lo stesso che identificare persone. Gli usi biometrici possono incontrare requisiti rigorosi o divieti specifici.",
      "check": "Chiedere descrizione tecnica esatta, finalità, luoghi, soggetti identificati e base normativa.",
      "offices": "Polizia locale, RTD, DPO, ICT e ufficio legale.",
      "ref": "Art. 5, art. 6 e Allegato III",
      "url": "https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-5"
    }
  ]
}</script>
<script>
'use strict';
const bank=JSON.parse(document.getElementById('case-data').textContent).cases;
const CAT={stop:{icon:'⛔',name:'Possibile pratica vietata',short:'STOP',explain:'Uso da fermare e valutare come possibile divieto.'},alto:{icon:'⚠️',name:'Possibile alto rischio',short:'ALTO RISCHIO',explain:'Servono verifica e requisiti specifici.'},trasp:{icon:'👁️',name:'Obblighi di trasparenza',short:'TRASPARENZA',explain:'Occorre verificare come informare le persone.'},ordin:{icon:'✅',name:'Uso ordinario',short:'USO ORDINARIO',explain:'Non emerge un obbligo specifico di alto rischio per l’uso descritto.'},verifica:{icon:'❔',name:'Informazioni insufficienti',short:'DA APPROFONDIRE',explain:'Prima di classificare occorre conoscere la funzione reale.'}};
const ids=Object.keys(CAT);
let s={screen:'home',mode:'participant',team:'Squadra del Comune',deck:[],idx:0,phase:'category',selected:null,reason:null,answers:[],revealed:false,paused:true,spent:0,runningAt:0,sourceScreen:'home'};
const app=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function newDeck(){const quotas={stop:2,alto:2,trasp:1,ordin:1,verifica:1};let chosen=[];for(const [kind,count] of Object.entries(quotas)){chosen.push(...shuffle(bank.filter(q=>q.answer===kind)).slice(0,count));}let more=shuffle(bank.filter(q=>!chosen.some(x=>x.id===q.id)));chosen.push(more[0]);return shuffle(chosen);}
function nowSpent(){return s.spent+(s.paused?0:Math.round((Date.now()-s.runningAt)/1000));}
function formatTime(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;}
function timeMarkup(){return `<span class="timer" aria-label="Tempo trascorso"><span data-time>${formatTime(nowSpent())}</span></span><button class="outline small" data-action="timer">${s.paused?'▶ Riprendi':'Ⅱ Pausa'}</button><button class="outline small" data-action="resetclock" title="Azzera il timer">↺</button>`;}
function render(){if(s.screen==='home')app.innerHTML=homeHTML();else if(s.screen==='game')app.innerHTML=gameHTML();else if(s.screen==='result')app.innerHTML=resultHTML();else if(s.screen==='help')app.innerHTML=helpHTML();else if(s.screen==='sources')app.innerHTML=sourcesHTML();updateTimes();}
function homeHTML(){return `<section class="hero center"><div class="eyebrow">ESERCITAZIONE 2 · QUIZ RAGIONATO</div><h1>Il <span class="accent">Radar</span> dell’AI Act</h1><p class="lead">Otto casi arrivano sulla tua scrivania. Riesci a distinguere un divieto, un possibile alto rischio, un obbligo di trasparenza e un uso ordinario?</p><div class="hero-icons" aria-hidden="true"><span>⛔</span><span>⚠️</span><span>👁️</span><span>✅</span><span>❔</span></div><div class="stats"><span class="stat">8 carte su 12</span><span class="stat">12–15 minuti</span><span class="stat">2 punti per carta</span><span class="stat">Nessun account</span></div></section><section class="panel homepanel"><label class="label" for="team">Nome della squadra (facoltativo)</label><input class="field" id="team" maxlength="52" autocomplete="off" value="${esc(s.team==='Squadra del Comune'?'':s.team)}" placeholder="Es. Gli istruttori del futuro"/><div class="mode-row"><button class="mode ${s.mode==='participant'?'selected':''}" data-action="mode" data-value="participant" aria-pressed="${s.mode==='participant'}"><strong>👥 Gioca in squadra</strong><span>Scegli il segnale e la motivazione. Guadagna punti e confronta le risposte.</span></button><button class="mode ${s.mode==='teacher'?'selected':''}" data-action="mode" data-value="teacher" aria-pressed="${s.mode==='teacher'}"><strong>🎤 Modalità formatore</strong><span>Proietta le carte e rivela le soluzioni dopo la discussione, senza punteggi.</span></button></div><button class="primary cta" data-action="start">${s.mode==='teacher'?'Avvia la sessione in aula':'Inizia il Radar'} →</button><p class="notes" style="margin:16px 0 0">Conta il ragionamento, non soltanto il colore. Alcuni casi richiedono ulteriori informazioni.</p></section>`;}
function gameHTML(){const c=s.deck[s.idx],isTeacher=s.mode==='teacher';let body='';if(s.phase==='category'&&!isTeacher){body=`<div class="questionbar"><span class="bubble">1</span>Qual è il segnale prevalente?</div><div class="classgrid">${ids.map(k=>`<button class="cat ${s.selected===k?'selected':''}" data-action="cat" data-value="${k}" data-cat="${k}" aria-pressed="${s.selected===k}"><span class="ci" aria-hidden="true">${CAT[k].icon}</span><strong>${esc(CAT[k].name)}</strong><small>${esc(CAT[k].explain)}</small></button>`).join('')}</div><div class="actions"><span class="muted">Scegli un segnale, poi motiva la scelta.</span><button class="primary" data-action="to-reason" ${!s.selected?'disabled':''}>Continua: scegli il motivo →</button></div>`;}else if(s.phase==='reason'&&!isTeacher){body=`<div class="questionbar"><span class="bubble">2</span>Qual è la motivazione più importante?</div><div class="panel answerbox"><div class="options">${c.reasons.map((r,i)=>`<button class="opt ${s.reason===i?'selected':''}" data-action="reason" data-value="${i}" aria-pressed="${s.reason===i}"><em>${'ABC'[i]}</em><span>${esc(r)}</span></button>`).join('')}</div><div class="actions"><button class="outline" data-action="backcategory">← Cambia categoria</button><button class="primary" data-action="confirm" ${s.reason===null?'disabled':''}>Conferma e scopri la soluzione</button></div></div>`;}else if(s.phase==='feedback'||(isTeacher&&s.revealed)){body=feedbackHTML(c,isTeacher);}else if(isTeacher){body=`<div class="panel answerbox"><h3>Domanda per l’aula</h3><p class="lead" style="margin:0 0 15px;font-size:17px;text-align:left">Qual è il segnale prevalente e quale domanda fareste prima di procedere?</p><div class="classgrid" aria-label="Possibili risposte">${ids.map(k=>`<div class="cat" data-cat="${k}"><span class="ci">${CAT[k].icon}</span><strong>${esc(CAT[k].name)}</strong></div>`).join('')}</div><div class="actions"><span class="muted">Dai il tempo ai gruppi di confrontarsi.</span><button class="primary" data-action="reveal">Mostra la soluzione →</button></div></div>`;}
return `<section class="stage-header"><div class="progress-meta"><span class="stat">${isTeacher?'MODALITÀ AULA':esc(s.team)}</span><span>Carta ${s.idx+1} di ${s.deck.length}</span>${!isTeacher?`<span>${s.answers.reduce((a,r)=>a+r.points,0)} punti</span>`:''}</div><div class="toolbar">${isTeacher&&s.idx>0?`<button class="outline small" data-action="prev">← Precedente</button>`:""}${timeMarkup()}<button class="ghost small" data-action="restart">Ricomincia</button></div></section><div class="progress-wrap"><div class="progress-fill" style="width:${((s.idx+1)/s.deck.length)*100}%"></div></div><section class="panel case-card"><div class="case-head"><div class="case-em" aria-hidden="true">${c.icon}</div><div><div class="sector">${esc(c.sector)} · CASO ${s.idx+1}</div><h2>${esc(c.title)}</h2></div></div><p class="case-text">${esc(c.text)}</p></section>${body}`;}
function feedbackHTML(c,isTeacher){const r=s.answers[s.idx],points=isTeacher?null:r.points;return `<section class="panel answerbox"><div class="feedback-top"><div class="eyebrow">${isTeacher?'SOLUZIONE PER IL FORMATORE':'RISPOSTA E SPIEGAZIONE'}</div>${!isTeacher?`<span class="points">+${points} / 2 punti</span>`:''}</div><h2 style="margin-top:10px">${CAT[c.answer].icon} ${esc(CAT[c.answer].name)}</h2>${!isTeacher?`<p class="muted">La tua scelta: <b>${esc(CAT[r.category].name)}</b> · Motivazione: ${r.reasonCorrect?'corretta':'da rivedere'}.</p>`:''}<div class="feedback-grid"><div class="panel feedback-detail"><h3>Perché?</h3><p>${esc(c.why)}</p><div class="keypoint">Domanda decisiva</div><p>${esc(c.reasons[c.right])}</p></div><div class="panel feedback-detail"><h3>Che cosa fare?</h3><p>${esc(c.check)}</p><h3>Chi coinvolgere?</h3><p>${esc(c.offices)}</p><div class="ref">${esc(c.ref)} · <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Fonte ufficiale ↗</a></div></div></div><div class="actions">${isTeacher?`<button class="outline" data-action="hide">Nascondi risposta</button>`:`<span class="muted">Rifletti sul ragionamento prima della prossima carta.</span>`}<button class="primary" data-action="next">${s.idx===s.deck.length-1?'Vai al riepilogo →':'Prossima carta →'}</button></div></section>`;}
function resultHTML(){const isTeacher=s.mode==='teacher',score=s.answers.reduce((a,r)=>a+r.points,0),max=s.deck.length*2;let message=score<=6?'Hai individuato alcuni segnali. Rivediamo insieme le domande decisive.':score<=11?'Buon lavoro: stai imparando a distinguere le funzioni davvero rilevanti.':'Ottimo ragionamento: hai motivato bene la maggior parte delle valutazioni.';return `<section class="panel resulthero"><div class="eyebrow">LABORATORIO COMPLETATO</div><h1 style="font-size:clamp(32px,4vw,49px)">${isTeacher?'Le otto carte del Radar':'Complimenti, '+esc(s.team)+'!'}</h1><p class="lead">${isTeacher?'Le soluzioni possono essere riviste per il confronto finale.':message}</p><div class="resultgrid"><div class="resultstat"><big>${s.deck.length}</big><small>Casi esaminati</small></div><div class="resultstat"><big>${isTeacher?'—':score+' / '+max}</big><small>${isTeacher?'Valutazione in aula':'Punteggio'}</small></div><div class="resultstat"><big>${formatTime(nowSpent())}</big><small>Tempo trascorso</small></div><div class="resultstat"><big>5</big><small>Segnali possibili</small></div></div><h3>Tre domande da portare in ufficio</h3><p><strong>Che cosa fa il sistema?</strong> · <strong>Quali persone o diritti influenza?</strong> · <strong>Quali verifiche servono?</strong></p><div class="actions" style="justify-content:center"><button class="primary" data-action="export">↓ Scarica il riepilogo (.txt)</button><button class="outline" data-action="print">⎙ Stampa</button><button class="outline" data-action="restart">↻ Nuova partita</button></div></section><section class="review"><h2>Rivedi gli otto casi</h2>${s.deck.map((c,i)=>{const a=s.answers[i];return `<details class="reviewitem"><summary><span>${c.icon} ${i+1}. ${esc(c.title)}</span><span class="pill ${!isTeacher&&a&&a.category!==c.answer?'wrong':'right'}">${esc(CAT[c.answer].short)}</span></summary><p>${esc(c.text)}</p>${!isTeacher?`<p>La tua scelta: <strong>${esc(CAT[a.category].name)}</strong>; motivazione ${a.reasonCorrect?'corretta':'da rivedere'} (${a.points}/2 punti).</p>`:''}<p><strong>Spiegazione:</strong> ${esc(c.why)}</p><p><strong>Verifica:</strong> ${esc(c.check)}</p><p class="ref">${esc(c.ref)}</p></details>`;}).join('')}</section>`;}
function helpHTML(){return `<section class="panel infobox"><div class="eyebrow">COME SI GIOCA</div><h2>Otto carte. Due decisioni.</h2><ol class="small-list"><li>Leggi la situazione proposta dall’ufficio.</li><li>Scegli il <strong>segnale prevalente</strong>: divieto, alto rischio, trasparenza, uso ordinario oppure dati insufficienti.</li><li>Seleziona la motivazione più importante.</li><li>Scopri la soluzione e confronta il tuo ragionamento con quello del gruppo.</li></ol><p>Ogni risposta corretta vale 1 punto: <strong>massimo 16 punti</strong>. La modalità formatore permette di proiettare la domanda e rivelare la spiegazione dopo il confronto, senza punteggi.</p><p>Per avere 12–15 minuti di discussione, il timer è solo indicativo: <strong>non blocca la partita</strong>.</p><p>Le cinque opzioni sono segnali didattici, non una classificazione normativa sempre esclusiva: in casi reali più obblighi possono coesistere.</p><button class="primary" data-action="return">← Torna indietro</button></section>`;}
function sourcesHTML(){return `<section class="panel infobox"><div class="eyebrow">FONTI E LIMITI</div><h2>Riferimenti normativi</h2><p>Scenari simulati, pensati per dipendenti della Pubblica Amministrazione italiana. Le soluzioni costituiscono <strong>valutazioni didattiche preliminari</strong>: non sostituiscono l'istruttoria del caso concreto.</p><div class="source-list"><div>⛔ <a target="_blank" rel="noopener noreferrer" href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-5">Articolo 5 — Pratiche vietate</a></div><div>⚠️ <a target="_blank" rel="noopener noreferrer" href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-6">Articolo 6 — Classificazione alto rischio</a></div><div>📋 <a target="_blank" rel="noopener noreferrer" href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/annex-3">Allegato III — Utilizzi ad alto rischio</a></div><div>👁️ <a target="_blank" rel="noopener noreferrer" href="https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-50">Articolo 50 — Trasparenza</a></div></div><p class="muted">Riferimento: versione consolidata UE aggiornata al 27 luglio 2026. Ultima revisione del laboratorio: ottobre 2026.</p><p>Un uso «ordinario» non è privo di obblighi: continuano ad applicarsi GDPR, sicurezza e altre norme pertinenti. L'alto rischio non è sinonimo di divieto. Alcune funzioni preparatorie possono richiedere un esame specifico ai sensi dell'art. 6(3).</p><p>L’app non utilizza cookie, analytics, database, modelli esterni o reti. Il nome della squadra e le risposte restano in questa pagina e vengono persi con il refresh.</p><button class="primary" data-action="return">← Torna indietro</button></section>`;}
function start(){const team=document.getElementById('team');s.team=(team&&team.value.trim().slice(0,52))||'Squadra del Comune';s.deck=newDeck();s.idx=0;s.phase='category';s.selected=null;s.reason=null;s.answers=[];s.revealed=false;s.screen='game';s.spent=0;s.runningAt=Date.now();s.paused=false;render();}
function next(){if(s.idx===s.deck.length-1){s.spent=nowSpent();s.paused=true;s.screen='result';render();return;}s.idx++;s.selected=null;s.reason=null;s.phase='category';s.revealed=false;render();window.scrollTo({top:0,behavior:'smooth'});}
function scoreAndReveal(){const c=s.deck[s.idx],rightCategory=s.selected===c.answer,rightReason=s.reason===c.right;s.answers.push({id:c.id,category:s.selected,reason:s.reason,reasonCorrect:rightReason,points:Number(rightCategory)+Number(rightReason)});s.phase='feedback';render();}
function exportTxt(){const lines=[`RADAR AI ACT — RIEPILOGO`,`Squadra: ${s.mode==='teacher'?'Modalità formatore':s.team}`,`Durata: ${formatTime(nowSpent())}`,`Punteggio: ${s.mode==='teacher'?'N/D':s.answers.reduce((n,a)=>n+a.points,0)+'/'+s.deck.length*2}`,'',...s.deck.flatMap((c,i)=>{const r=s.answers[i];return [`${i+1}. ${c.title}`,`Scenario: ${c.text}`,`Segnale atteso: ${CAT[c.answer].name}`,`Motivazione: ${c.reasons[c.right]}`,`Spiegazione: ${c.why}`,`Da verificare: ${c.check}`,`Referenti: ${c.offices}`,`Riferimento: ${c.ref}`,`Fonte: ${c.url}`,...(r?[`Scelta: ${CAT[r.category].name} — motivazione ${r.reasonCorrect?'corretta':'da rivedere'} — ${r.points}/2 punti`]:[]),''];}), 'Materiale didattico: non sostituisce una valutazione giuridica del caso concreto.'];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='radar-ai-act-riepilogo.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),600);}
let storedScreen='home';
document.addEventListener('click',e=>{let btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;const v=btn.dataset.value;if(a==='mode'){const currentTeam=document.getElementById('team');if(currentTeam&&currentTeam.value.trim())s.team=currentTeam.value.trim().slice(0,52);s.mode=v;render();}else if(a==='start')start();else if(a==='cat'&&s.phase==='category'){s.selected=v;render();}else if(a==='to-reason'&&s.selected){s.phase='reason';render();}else if(a==='reason'&&s.phase==='reason'){s.reason=Number(v);render();}else if(a==='backcategory'){s.phase='category';render();}else if(a==='confirm'&&s.reason!==null&&s.selected)scoreAndReveal();else if(a==='reveal'&&s.mode==='teacher'){s.revealed=true;render();}else if(a==='hide'&&s.mode==='teacher'){s.revealed=false;render();}else if(a==='next')next();else if(a==='prev'&&s.mode==='teacher'&&s.idx>0){s.idx--;s.revealed=false;render();}else if(a==='restart'){if(confirm('Vuoi ricominciare? Le risposte della partita corrente saranno perse.')){s.spent=0;s.paused=true;s.mode='participant';s.screen='home';render();}}else if(a==='home'){if(s.screen==='game'&&!confirm('Tornare all’inizio? La partita corrente verrà interrotta.'))return;s.spent=0;s.paused=true;s.screen='home';render();}else if(a==='timer'){if(s.paused){s.runningAt=Date.now();s.paused=false;}else{s.spent=nowSpent();s.paused=true;}render();}else if(a==='resetclock'){s.spent=0;s.runningAt=Date.now();render();}else if(a==='help'||a==='sources'){if(s.screen!=='help'&&s.screen!=='sources')storedScreen=s.screen;s.screen=a;render();}else if(a==='return'){s.screen=storedScreen;render();}else if(a==='export'){exportTxt();}else if(a==='print'){window.print();}});
document.querySelector('.brand').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.querySelector('.brand').click();}});
function updateTimes(){if(s.screen==='game'){document.querySelectorAll('[data-time]').forEach(el=>{el.textContent=formatTime(nowSpent());});}}
setInterval(updateTimes,1000);
render();
</script>
</body>
</html>
